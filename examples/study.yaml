# A complete simulated study. Run it with:
#
#     thalamus run examples/study.yaml
#
# Then, in another terminal:
#
#     thalamus devices
#     thalamus monitor eeg eye_tracker --sync
#
# Everything below is a dry run: no hardware, no participants. The data is replayed
# from files in examples/data/ (regenerate them with `thalamus make-data`), and the
# failure modes are only those that are configured explicitly.
#
# The two devices are named by `profile:`, so they emit the columns their real
# hardware writes. That is what
# makes this worth doing: a profile gives you the *real* column names — BPOGX, EEG1,
# ValidationIndicator — so the analysis code you write against this dry run is the
# code you run against the recording, unchanged. Invent your own column names and
# you have simulated a study you will have to rewrite.
#
#     thalamus profiles              # what is available
#     thalamus profiles gp3          # every column, in full

core:
  device_port: 9000
  client_port: 9001

devices:
  # ---------------------------------------------------------------------------
  # g.tec Unicorn Hybrid Black — 8-channel EEG at 250 Hz, replayed from a file.
  #
  # No `rate:` here on purpose: without one, the file's own timestamps drive the
  # replay, so it streams with whatever jitter the original recording had. That is
  # a more honest simulation than a perfectly periodic 250 Hz — no real amplifier
  # is perfectly periodic, and code that assumes it is should break here, in a dry
  # run, rather than in the study.
  # ---------------------------------------------------------------------------
  - id: eeg
    type: replay
    path: data/eeg.csv
    profile: unicorn_hybrid_black
    loop: true
    simulate:
      # A drifting electrode: a DC offset that grows over the session, as occurs when
      # the gel dries and the impedance changes. A constant bias affects analysis code
      # differently from zero-mean noise.
      #
      # Only the EEG channels. Adding a drift to the battery level or the sample
      # counter would be meaningless — and that is the point of naming the channels:
      # this device has 17 columns and only 8 of them are brain.
      - stage: constant_noise
        offset: 0.5
        drift: 0.0002
        channels: [EEG1, EEG2, EEG3, EEG4, EEG5, EEG6, EEG7, EEG8]

      # Bluetooth packet loss — asked for, not inherited. The reference Unicorn
      # recording dropped nothing at all in 26 minutes (the Counter runs unbroken), so
      # the profile simulates no loss by default. This deliberately imagines a worse
      # link than that, which is a legitimate thing to want.
      #
      # Note the failure this models: the sample never arrives *at all*, so the Counter
      # column jumps. Anything that infers a sampling rate by counting samples will
      # quietly get it wrong, and the Counter is how you catch that. A dropped sample
      # and a dropped value are different failures and want different code.
      - stage: dropout
        probability: 0.0008
        burst: 3
        seed: 11

  # ---------------------------------------------------------------------------
  # Gazepoint GP3 HD — 150 Hz eye tracker, generated rather than replayed.
  #
  # Same five columns the real tracker writes: BPOGX, BPOGY (gaze, normalized to
  # the screen — 0..1, not pixels), BPOGV (the validity flag), LPD and RPD (pupil
  # diameter per eye, in camera pixels).
  # ---------------------------------------------------------------------------
  - id: eye_tracker
    type: synthetic
    profile: gp3
    seed: 2
    simulate:
      # Blinks, copied from a real recording rather than imagined.
      #
      # `mode: hold` is the important word, and it is not the obvious one. The GP3 does
      # not blank anything during a blink — it FREEZES. In the real 26-minute file, 115
      # of the 116 multi-sample blinks have every column identical throughout, and 116
      # of the 118 onsets repeat the preceding valid row exactly. So a blink arrives as
      # ~130 ms of perfectly plausible, perfectly unchanging numbers, with a 0 in BPOGV
      # that nothing forces you to read.
      #
      # Simulating it as a nice obvious gap would be simulating a kinder device than
      # the one you own. Here, a client that ignores BPOGV silently averages 130 ms of
      # frozen pupil into its baseline — exactly as it would on the day. The fix is to
      # subscribe with `validity_mask` (see examples/clients.py), and the point of the
      # dry run is that you find that out now.
      - stage: missing_inject
        mode: hold
        probability: 0.0005      # one blink per ~13 s, as in the recording
        burst: [6, 34]           # median ~130 ms at 150 Hz
        channels: [BPOGX, BPOGY, LPD, RPD]
        flag: BPOGV
        seed: 7

  # ---------------------------------------------------------------------------
  # An ECG on a flaky wireless link. No profile — this is the hand-rolled form,
  # for a device Thalamus has never heard of.
  # ---------------------------------------------------------------------------
  - id: ecg
    type: synthetic
    rate: 128
    seed: 3
    signals:
      lead_ii:
        kind: ecg
        heart_rate: 72
    simulate:
      # Packet loss again, but note the difference from a missing *value*: here the
      # sample does not exist at all. A gap in the data and a gap in the stream are
      # different failures and want different code.
      - stage: dropout
        probability: 0.001
        burst: 5
        seed: 9
