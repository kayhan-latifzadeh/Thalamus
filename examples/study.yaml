# A complete simulated study. Run it with:
#
#     thalamus run examples/study.yaml
#
# Then, in another terminal:
#
#     thalamus devices
#     thalamus monitor eeg eye_tracker --sync
#
# Everything below is a dry run: no hardware, no participants. The data is
# replayed from files in examples/data/ (regenerate them with `thalamus make-data`),
# and the things that go wrong are things you asked to go wrong.

core:
  device_port: 9000
  client_port: 9001

devices:
  # ---------------------------------------------------------------------------
  # A 250 Hz EEG cap, replayed from a recording.
  #
  # No `rate:` here on purpose: without one, the file's own timestamps drive the
  # replay, so it streams with whatever jitter the original recording had. That is
  # a more honest simulation than a perfectly periodic 250 Hz — no real amplifier
  # is perfectly periodic, and code that assumes it is should break here, in a dry
  # run, rather than in the study.
  # ---------------------------------------------------------------------------
  - id: eeg
    type: replay
    path: data/eeg.csv
    loop: true
    simulate:
      # A drifting electrode: a DC offset that grows through the session, as a real
      # electrode's does as the gel dries and the impedance changes. Constant bias
      # breaks analysis code in ways random noise does not.
      - stage: constant_noise
        offset: 0.5
        drift: 0.0002

  # ---------------------------------------------------------------------------
  # A 150 Hz eye tracker, generated rather than replayed — no file needed.
  # ---------------------------------------------------------------------------
  - id: eye_tracker
    type: synthetic
    rate: 150
    seed: 2
    signals:
      pupil:
        kind: sine
        freq: 0.2
        amplitude: 0.4
        offset: 3.5
      gaze_x:
        kind: random_walk
        step: 6
        start: 960
        minimum: 0
        maximum: 1920
      gaze_y:
        kind: random_walk
        step: 4
        start: 540
        minimum: 0
        maximum: 1080
    simulate:
      # Blinks. At 150 Hz, a burst of 15-60 samples is 100-400 ms with no pupil —
      # which is what a blink actually looks like in an eye-tracking file. Note this
      # blanks `pupil` only: the tracker keeps reporting a gaze position, it just
      # cannot see the pupil. Handling that asymmetry is the sort of thing you would
      # rather discover now.
      - stage: missing_inject
        probability: 0.004
        burst: [15, 60]
        channels: [pupil]
        seed: 7

  # ---------------------------------------------------------------------------
  # An ECG on a flaky wireless link.
  # ---------------------------------------------------------------------------
  - id: ecg
    type: synthetic
    rate: 128
    seed: 3
    signals:
      lead_ii:
        kind: ecg
        heart_rate: 72
    simulate:
      # Packet loss: whole samples that never arrive, in bursts of 5. Distinct from
      # a missing *value* — here the sample does not exist at all, so anything that
      # infers a sampling rate by counting samples will quietly get it wrong.
      - stage: dropout
        probability: 0.001
        burst: 5
        seed: 9
